<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEase Hub - Admin Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin-bottom: 6px; color: #1e293b; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #1d4ed8; }
        .error { color: #ef4444; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>StayEase Admin Hub</h2>
    <p>Please enter the dashboard security passcode</p>
    <input type="password" id="passcodeField" placeholder="Enter Admin Passcode" onkeydown="if(event.key==='Enter') attemptLogin()">
    <button onclick="attemptLogin()">Sign In</button>
    <div id="errorMessage" class="error">Invalid admin passcode. Access denied.</div>
</div>

<script>
    function attemptLogin() {
        const input = document.getElementById('passcodeField').value;
        const error = document.getElementById('errorMessage');

        // Let's set your secret passcode to "admin123" (You can change this to whatever you like!)
        if (input === 'admin123') {
            localStorage.setItem('adminAuthenticated', 'true');
            window.location.href = 'admin.html';
        } else {
            error.style.display = 'block';
        }
    }
</script>

</body>
</html>
